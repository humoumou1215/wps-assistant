[package]
name = "wps-assistant-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[dependencies]
tray-icon = { version = "=0.26.0", default-features = false }
tao = { version = "=0.37.1", default-features = false }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["json"] }
fs2 = "0.4"
dirs = "6"
dunce = "1"
rfd = { version = "0.15", default-features = false }
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

name: Bug report
description: 报告桥接、任务面板或 WPS 宿主问题
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js 版本、WPS 版本/Build、宿主（Writer/ET/WPP）和项目版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 使用可丢弃文档说明最小复现过程
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志和截图
      description: 提供错误码和关联 ID；删除 API Key、Headers、文档内容及个人路径

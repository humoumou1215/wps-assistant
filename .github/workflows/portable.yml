name: Portable desktop

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'addon/**', 'skills/**', 'package*.json', '.github/workflows/portable.yml']

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm run check
      - run: npm run build:portable
      - name: Upload portable archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

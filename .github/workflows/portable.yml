name: Portable desktop

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'addon/**', 'skills/**', 'package*.json', '.github/workflows/portable.yml', '.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm run check
      - run: npm run build:portable
      - name: Upload portable archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: portable-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

  verify-download:
    name: Verify release artifact download
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-*
          path: assets
          merge-multiple: true
          digest-mismatch: error
      - name: Verify files and checksums
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          prefix="wps-assistant-$version"
          for suffix in \
            darwin-arm64.zip darwin-arm64.dmg \
            darwin-x64.zip darwin-x64.dmg \
            win32-x64.zip win32-x64.exe; do
            test -s "assets/$prefix-$suffix"
            test -s "assets/$prefix-$suffix.sha256"
          done
          test "$(find assets -type f | wc -l)" -eq 12
          cd assets
          sha256sum --check --strict *.sha256

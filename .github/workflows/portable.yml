name: Portable desktop

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'addon/**', 'skills/**', 'package*.json', '.github/workflows/portable.yml']

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm run check
      - run: npm run build:portable
      - name: Upload portable archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portable-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 14

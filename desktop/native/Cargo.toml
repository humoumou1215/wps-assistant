[package]
name = "wps-assistant-tray"
version = "0.1.22"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
serde_json = "1"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "=0.1.31"

[dependencies]
tray-icon = { version = "=0.26.0", default-features = false }
tao = { version = "=0.37.1", default-features = false }
serde_json = "1"
# 自解压单文件只做解压，用纯 Rust 后端，避免依赖系统 zlib 或 C 工具链。
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
fs2 = "0.4"
dirs = "6"
dunce = "1"
rfd = { version = "0.15", default-features = false }
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
